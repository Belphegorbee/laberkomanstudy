<!DOCTYPE html>
<html lang="id">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Dashboard Pro</title>

<style>
:root{
  --bg:#07080a;
  --panel:#0e0f13;
  --panel2:#14161d;

  --text:#eaf2ff;
  --muted:#94a3b8;

  --blue:#3b82f6;
  --cyan:#22d3ee;
  --green:#22c55e;
  --red:#ef4444;

  --radius:16px;
}

/* RESET & BASE */
*{
  box-sizing:border-box;
  font-family: 'Inter', Arial, sans-serif;
  user-select:none;
  margin:0;
  padding:0;
}

body{
  background: radial-gradient(circle at top, #0f172a, #07080a);
  color: var(--text);
  padding: 16px;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 100vh;
  line-height: 1.6;
}

/* HEADER */
.header{
  text-align:center;
  padding:24px 16px;
  border-radius:var(--radius);
  background: linear-gradient(145deg, #0e0f13, #07080a);
  border: 1px solid rgba(59,130,246,0.3);
  margin-bottom: 20px;
}

.title{
  font-size:24px;
  font-weight:900;
  letter-spacing:2px;
  color: #fff;
  text-shadow: 0 0 10px rgba(59,130,246,0.5);
}

.sub{
  font-size:13px;
  color:var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 6px;
}

/* NAV */
.nav{
  display:flex;
  gap:12px;
  margin-bottom: 20px;
}

.nav button{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.03);
  color: var(--muted);
  font-size:16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
}

.nav button.active{
  background: rgba(59,130,246,0.15);
  border-color: var(--cyan);
  color: #fff;
  box-shadow: 0 0 12px rgba(34,211,238,0.2);
}

/* SWIPE & PAGES */
.swipe-wrap{
  overflow: hidden;
  width: 100%;
}

.swipe{
  display:flex;
  width:200%;
  transition: transform .35s cubic-bezier(0.4, 0, 0.2, 1);
  align-items: flex-start;
}

.page{
  width:50%;
  padding: 4px;
}

/* SECTION TITLE */
.section-title{
  text-align:center;
  font-size:18px;
  font-weight:800;
  margin: 10px 0 16px 0;
  letter-spacing:1px;
  color: var(--cyan);
  text-transform: uppercase;
}

/* PANEL */
.panel{
  background: var(--panel);
  border-radius: var(--radius);
  padding: 20px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

/* GRID LAYOUTS */
.layout{
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media(min-width: 650px) {
  .layout {
    grid-template-columns: 1fr 1fr;
  }
}

/* QUOTE */
.quote-box{
  text-align: center;
  padding: 16px;
  border-radius: var(--radius);
  margin-bottom: 20px;
  background: rgba(34,211,238,0.03);
  border: 1px solid rgba(34,211,238,0.15);
}

.quote{
  font-size: 16px;
  font-style: italic;
  color: #bae6fd;
}

/* RING SVG CONTAINER */
.ring-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 10px auto;
}

.ring{
  width: 110px;
  height: 110px;
}

circle{
  fill: none;
  stroke-width: 8;
  transform: rotate(-90deg);
  transform-origin: 50px 50px;
}

.bg{
  stroke: #1e293b;
}

.progress{
  stroke-linecap: round;
  transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
}

/* GLOBAL STATS ALIGNMENT */
.global-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.stats{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  width: 100%;
  text-align: center;
  margin-top: 10px;
}

.stat{
  background: rgba(255,255,255,0.02);
  padding: 10px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--muted);
}

.stat b{
  font-size: 18px;
  color: #fff;
  display: block;
  margin-top: 2px;
}

/* PROGRESS LIST CONTAINER */
#progress {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.progress-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,0.02);
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.03);
}

.progress-info {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
}

/* TASKS */
#tasks {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.task{
  background: var(--panel2);
  padding: 18px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.05);
}

.task-title{
  font-weight: 800;
  font-size: 18px;
  color: var(--cyan);
  margin-bottom: 4px;
}

.task-desc {
  font-size: 15px;
  color: var(--muted);
  margin-bottom: 16px;
}

.actions{
  display: flex;
  gap: 12px;
}

.actions button{
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}

.actions button:active {
  opacity: 0.7;
}

.do { color: #fff; background: var(--green); }
.fail { color: #fff; background: var(--red); }
</style>
</head>

<body>

<div class="header">
  <div class="title">SYSTEM DASHBOARD PRO</div>
  <div class="sub">discipline • execution • tracking system</div>
</div>

<div class="nav">
  <button class="active" id="b0" onclick="go(0)">Dashboard</button>
  <button id="b1" onclick="go(1)">Tasks</button>
</div>

<div class="quote-box">
  <div class="quote" id="quote">...</div>
</div>

<div class="swipe-wrap">
<div class="swipe" id="swipe">

<div class="page">
  <div class="section-title">GLOBAL PERFORMANCE</div>
  <div class="panel">
    <div id="global" class="global-box"></div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="section-title">TODAY STATUS</div>
      <div id="today"></div>
    </div>

    <div class="panel">
      <div class="section-title">SHEET PROGRESS</div>
      <div id="progress"></div>
    </div>
  </div>
</div>

<div class="page">
  <div class="panel">
    <div class="section-title">OPEN TASKS</div>
    <div id="tasks"></div>
  </div>
</div>

</div>
</div>

<script>
const URL="https://script.google.com/macros/s/AKfycbwtE8suaeLY1bn3Bt4oHlEzQJ4tJaSlPCqYWLJUZMnQwELmw-NP5ingYQQ3yG1yxSaA/exec";

// Modifikasi struktur lingkaran menggunakan tag <text> internal SVG agar presisi di tengah
function circle(percent, color, label = percent + "%"){
const r=32;
const c=2*Math.PI*r;
return `
<div class="ring-container">
<svg class="ring" viewBox="0 0 100 100">
  <circle class="bg" r="${r}" cx="50" cy="50"/>
  <circle class="progress"
    r="${r}" cx="50" cy="50"
    stroke="${color}"
    stroke-dasharray="${c}"
    stroke-dashoffset="${c-(percent/100)*c}"/>
  <text x="50" y="54" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">${label}</text>
</svg>
</div>
`;
}

function go(i){
document.getElementById("swipe").style.transform=`translateX(-${i*50}%)`;
document.getElementById("b0").classList.remove("active");
document.getElementById("b1").classList.remove("active");
document.getElementById("b"+i).classList.add("active");
}

fetch(URL).then(r=>r.json()).then(d=>{

document.getElementById("quote").innerText="💡 "+d.quote;

/* GLOBAL RING */
const g=d.global;
document.getElementById("global").innerHTML=`
${circle(g.percent,"#22d3ee")}
<div class="stats">
  <div class="stat">SUCCESS<br><b>${g.success}</b></div>
  <div class="stat">FAIL<br><b>${g.fail}</b></div>
  <div class="stat">OPEN<br><b>${g.open}</b></div>
</div>
`;

/* TODAY RING */
const t=d.today;
let col=t.status==="WIN"?"#22c55e":t.status==="LOSS"?"#ef4444":"#fbbf24";
document.getElementById("today").innerHTML=`
${circle(t.success/(t.success+t.fail)*100, col, t.status)}
<div style="text-align:center; font-size:15px; margin-top:12px; background: rgba(255,255,255,0.02); padding: 8px; border-radius: 8px;">
  S: <span style="color:var(--green); font-weight:bold">${t.success}</span> &nbsp;|&nbsp; 
  F: <span style="color:var(--red); font-weight:bold">${t.fail}</span> &nbsp;|&nbsp; 
  <span style="color:#fbbf24; font-weight:bold">STREAK ${t.streak}</span>
</div>
`;

/* PROGRESS */
const p=document.getElementById("progress");
p.innerHTML = ""; // Clear loader text

d.progress.forEach(x=>{
const el=document.createElement("div");
el.className = "progress-item";
el.innerHTML=`
<div class="progress-info">${x.sheet}</div>
<div style="width: 60px; height: 60px; margin: 0;">
  <svg viewBox="0 0 100 100" style="width:100%; height:100%;">
    <circle class="bg" r="32" cx="50" cy="50" stroke-width="10"/>
    <circle class="progress" r="32" cx="50" cy="50" stroke-width="10"
      stroke="#3b82f6"
      stroke-dasharray="${2*Math.PI*32}"
      stroke-dashoffset="${(2*Math.PI*32)-((x.percent/100)*(2*Math.PI*32))}"/>
    <text x="50" y="55" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">${x.percent}%</text>
  </svg>
</div>
`;
p.appendChild(el);
});

/* TASK */
const tsk=document.getElementById("tasks");
tsk.innerHTML = ""; // Clear loader text

d.tasks.forEach(x=>{
const el=document.createElement("div");
el.className="task";

el.innerHTML=`
<div class="task-title">${x.sheet}</div>
<div class="task-desc">${x.judul||"-"}</div>

<div class="actions">
  <button class="do">DO IT</button>
  <button class="fail">FAIL</button>
</div>
`;

el.querySelector(".do").onclick=()=>{
const pages={
  "FILSAFAT":"FILSAFAT.HTML",
  "BEBAS":"BEBAS.HTML",
  "INVESTASI":"INVESTASI.HTML",
  "KONTEN":"KONTEN.HTML",
  "PROGRAM":"PROGRAM.HTML",
  "SCM":"SCM.HTML",
  "TRIK":"TRIK.HTML"
};

const sheet=x.sheet.trim().toUpperCase();
const target=pages[sheet];

if(target){
  window.location.href="./"+target;
}else{
  alert("Halaman tidak ditemukan : "+sheet);
}
};

el.querySelector(".fail").onclick=()=>{
fetch(URL,{
method:"POST",
body:JSON.stringify({
action:"fail",
sheet:x.sheet,
tanggal:x.tanggal
})
}).then(()=>location.reload());
};

tsk.appendChild(el);
});

});
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html

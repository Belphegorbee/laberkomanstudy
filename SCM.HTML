<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>SCM Log</title>

<style>
:root {
  --bg: #0a0c10;
  --card: #12151b;
  --border: #1f2630;
  --text: #e6eaf0;
  --muted: #7a8599;
  --accent: #3b82f6; /* biru = sistem/kontrol */
}

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

::selection {
  background: #12151b;
  color: #12151b;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #111827 0%, #0a0c10 100%);
  font-family: "Inter", "Segoe UI", sans-serif;
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 30px 15px;
}

.container {
  width: 100%;
  max-width: 420px;
}

.header {
  margin-bottom: 20px;
}

.header h1 {
  margin: 0;
  font-size: 22px;
}

.header p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
}

label {
  font-size: 12px;
  color: var(--muted);
  margin-top: 12px;
  display: block;
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #0a0c10;
  color: var(--text);
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  border: none;
  font-weight: 600;
  background: var(--accent);
  color: #fff;
}

button:active {
  background: #1e40af;
  transform: scale(0.97);
}

button:disabled {
  background: #333;
  color: #777;
}

.status {
  text-align: center;
  margin-top: 12px;
  font-size: 13px;
}

.success { color: #3b82f6; }
.error { color: #f87171; }
.loading { color: #aaa; }

.footer {
  margin-top: 20px;
  font-size: 11px;
  text-align: center;
  color: #555;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>SCM Log</h1>
    <p>System. Control. Consistency.</p>
  </div>

  <div class="card">
    <form id="form">

      <label>Tanggal</label>
      <input type="text" id="tanggal" readonly>

      <label>Aktivitas / Sistem</label>
      <input type="text" id="judul" required>

      <label>Durasi</label>
      <select id="jam" required>
        <option value="">Pilih durasi</option>
        <option value="0,25">0,25 (15 menit)</option>
        <option value="0,5">0,5 (30 menit)</option>
        <option value="0,75">0,75 (45 menit)</option>
        <option value="1">1 (1 jam)</option>
        <option value="1,5">1,5 (1 jam 30 menit)</option>
        <option value="2">2 (2 jam)</option>
      </select>

      <label>Insight Sistem</label>
      <input type="text" id="kata" required>

      <label>Catatan Operasional</label>
      <textarea id="catatan" rows="3" required></textarea>

      <button id="submitBtn" type="submit">SUBMIT</button>

    </form>

    <div id="statusText" class="status"></div>
  </div>

  <div class="footer">
    system > effort
  </div>

</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwtE8suaeLY1bn3Bt4oHlEzQJ4tJaSlPCqYWLJUZMnQwELmw-NP5ingYQQ3yG1yxSaA/exec";

const form = document.getElementById("form");
const statusText = document.getElementById("statusText");
const btn = document.getElementById("submitBtn");

// tanggal otomatis
const today = new Date();
const formatDate = today.toISOString().split('T')[0];
document.getElementById("tanggal").value = formatDate;

// autofocus
document.getElementById("judul").focus();

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const jam = document.getElementById("jam").value;

  if (!jam) {
    statusText.innerText = "Pilih durasi dulu.";
    statusText.className = "status error";
    return;
  }

  btn.disabled = true;
  btn.innerText = "PROCESSING...";
  statusText.innerText = "Mengirim...";
  statusText.className = "status loading";

  fetch(WEB_APP_URL, {
    method: "POST",
    body: JSON.stringify({
      sheet: "SCM", // 🔥 beda di sini
      tanggal: document.getElementById("tanggal").value,
      judul: document.getElementById("judul").value,
      jam: jam,
      kata: document.getElementById("kata").value,
      catatan: document.getElementById("catatan").value
    })
  })
  .then(res => res.json())
  .then(() => {
    statusText.innerText = "✓ Tersimpan";
    statusText.className = "status success";

    form.reset();
    document.getElementById("tanggal").value = formatDate;
    document.getElementById("judul").focus();
  })
  .catch(() => {
    statusText.innerText = "Gagal kirim";
    statusText.className = "status error";
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerText = "SUBMIT";
  });
});
</script>

</body>
</html>
